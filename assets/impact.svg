<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#ffffff"/>

  <text x="70" y="62" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" fill="#8E5870" letter-spacing="2">主な実績</text>
  <text x="70" y="101" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#232A34">実務で強くアピールしたいポイント</text>
  <line x1="70" y1="120" x2="1130" y2="120" stroke="#E8DCE3" stroke-width="2"/>

  <rect x="70" y="150" width="510" height="190" rx="22" fill="#F4E8ED" stroke="#D9C6D0"/>
  <text x="98" y="185" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#8E5870">1. 大規模クラウドサービス経験</text>
  <text x="98" y="235" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="32" font-weight="700" fill="#5C3547">数十万規模の顧客基盤</text>
  <text x="98" y="265" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16" fill="#5F6671">を持つ企業のクラウドサービスに従事</text>
  <rect x="98" y="286" width="160" height="34" rx="17" fill="#FFFFFF" stroke="#E0D1D8"/>
  <text x="178" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7C3F5A">Linux / AWS</text>
  <rect x="272" y="286" width="180" height="34" rx="17" fill="#FFFFFF" stroke="#E0D1D8"/>
  <text x="362" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9A5C79">CloudFormation</text>
  <text x="98" y="329" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="12" fill="#6B7280">設計・構築・運用・障害調査・改善</text>

  <rect x="620" y="150" width="510" height="190" rx="22" fill="#F8F1F4" stroke="#E6D9E0"/>
  <text x="648" y="185" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#8E5870">2. リーダーシップ</text>
  <text x="648" y="235" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#5C3547">プロジェクトリーダー</text>
  <text x="648" y="268" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" fill="#5F6671">複数案件推進 / 顧客・開発・運用の調整</text>
  <text x="648" y="297" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#6B7280">進捗・課題・コスト管理</text>
  <text x="648" y="323" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="11" fill="#8B919A">最大50名規模の案件経験</text>

  <rect x="70" y="375" width="510" height="190" rx="22" fill="#F1E1E8" stroke="#D7BCC8"/>
  <text x="98" y="410" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#8E5870">3. 会社経営</text>
  <text x="98" y="458" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7C3F5A">4 yrs</text>
  <text x="98" y="487" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" fill="#5F6671">法人設立・運営</text>
  <text x="98" y="514" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#6B7280">複数案件の受託・納品 / コスト改善 / 目標短期達成</text>

  <rect x="620" y="375" width="510" height="190" rx="22" fill="#F9F4F6" stroke="#E6D9E0"/>
  <text x="648" y="410" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#8E5870">4. 自動化・実装</text>

  <circle cx="740" cy="485" r="58" fill="#7C3F5A"/>
  <text x="740" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Shell</text>
  <text x="740" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Script</text>

  <circle cx="850" cy="455" r="40" fill="#B76788"/>
  <text x="850" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Python</text>

  <circle cx="920" cy="505" r="24" fill="#C98FA8"/>
  <text x="920" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF">JS</text>

  <circle cx="970" cy="470" r="20" fill="#D8A9BC"/>
